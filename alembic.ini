[alembic]
script_location = alembic
prepend_sys_path = src
# The URL is supplied by ACQBOT_DATABASE_URL (see alembic/env.py); this value is a fallback only.
sqlalchemy.url = postgresql+pg8000://postgres:postgres@127.0.0.1:5432/acqbot
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
